name: Mission 02 reference acceptance

on:
  push:
    branches:
      - feature/research-baseline-mission02
  pull_request:
    paths:
      - 'experiments/mission_02/**'
      - 'tests/test_mission02_model.py'
      - '.github/workflows/mission02.yml'

jobs:
  resource-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resource limits, packetization and conservation
        run: python -m unittest discover -s tests -p 'test_mission02_model.py' -v

  basilisk-coupled-smoke:
    needs: resource-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Basilisk
        run: python -m pip install "bsk[all,examples]==2.12.2"
      - name: Generate physical orbit and compare scheduling policies
        run: python -m experiments.mission_02.run --duration-hours 0.3 --step-s 10 --output-name mission02_acceptance
      - name: Validate machine-readable experiment outputs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out = Path("results/mission02_acceptance")
          manifest = json.loads((out/"manifest.json").read_text())
          comparison = json.loads((out/"comparison.json").read_text())
          assert len(comparison) == 3
          assert len(manifest["config_sha256"]) == len(manifest["orbit_track_sha256"]) == 64
          assert Path(manifest["orbit_track"]).is_file()
          policies = {s["policy"] for s in comparison}
          assert policies == {"fifo", "edf", "priority"}
          for s in comparison:
              assert abs(s["balance_error_bits"]) < 0.1, s
              assert 0 <= s["stored_bits"] <= s["capacity_bits"], s
              assert 0 <= s["weighted_on_time_fraction"] <= 1, s
              assert s["min_battery_wh"] >= 5-1e-6, s
              with (out/f'{s["policy"]}_states.csv').open() as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) >= 100
          assert (out/"policy_comparison.png").is_file()
          assert (out/"memory_over_time.png").is_file()
          assert (out/"battery_over_time.png").is_file()
          print("MISSION02 ACCEPTED: 3 policies, constrained balances, Basilisk trajectory")
          PY
      - name: Parameter-sweep smoke on the exact same orbit
        run: |
          python -m experiments.mission_02.sweep --track results/mission02_acceptance_basilisk_geometry/access.csv --radio-bps 20000,160000 --battery-wh 15,65 --storage-bytes 1000000,4000000 --output-name mission02_sweep_ci
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("results/mission02_sweep_ci")
          result = json.loads((p/"sweep.json").read_text())
          assert len(result) == 24
          assert all(abs(x["balance_error_bits"]) < 0.1 for x in result)
          assert all(0 <= x["on_time_fraction"] <= 1 for x in result)
          print("MISSION02 SWEEP OK: 24 distinct condition-policy combinations")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission02-acceptance
          path: |
            results/mission02_acceptance/
            results/mission02_acceptance_basilisk_geometry/
            results/mission02_sweep_ci/
          if-no-files-found: warn

  basilisk-windows-reference:
    needs: resource-unit-tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Basilisk 2.12.2
        run: python -m pip install "bsk[all,examples]==2.12.2"
      - name: Run the same reference mission on Windows
        run: python -m experiments.mission_02.run --duration-hours 0.3 --step-s 10 --output-name mission02_windows_acceptance
      - name: Verify constrained scheduling results on Windows
        run: |
          python -c "import json,pathlib; p=pathlib.Path('results/mission02_windows_acceptance'); s=json.loads((p/'comparison.json').read_text()); assert len(s)==3; assert all(abs(x['balance_error_bits'])<0.1 for x in s); assert any(x['captured']>0 for x in s); print('WINDOWS MISSION 02 ACCEPTED')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission02-windows-acceptance
          path: results/mission02_windows_acceptance/
          if-no-files-found: warn

  basilisk-reaction-wheel-dynamics:
    needs: resource-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Basilisk 2.12.2
        run: python -m pip install "bsk[all,examples]==2.12.2"
      - name: Simulate bounded physical RW dynamics
        run: python -m experiments.ground_01.run_ground --adcs --actuator rw --duration-hours 0.2 --step-s 0.5 --output-name adcs02_rw_acceptance
      - name: Validate wheel speed saturation and actual pointing response
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("results/adcs02_rw_acceptance")
          result = json.loads((folder/"adcs_summary.json").read_text())
          summary = json.loads((folder/"summary.json").read_text())
          assert result["actuation"] == "physical_basilisk_reactionWheelStateEffector"
          assert result["actual_max_abs_rw_speed_rpm"] <= result["rw_speed_limit_rpm"] + 3
          assert result["minimum_boresight_error_deg"] < result["initial_boresight_error_deg"]
          assert summary["checks_passed"]
          assert (folder/"adcs02_reaction_wheels.csv").is_file()
          print("BASILISK PHYSICAL RW ACCEPTED: max RPM", result["actual_max_abs_rw_speed_rpm"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adcs02-physical-wheels
          path: results/adcs02_rw_acceptance/
          if-no-files-found: warn

  basilisk-power-dynamics:
    needs: resource-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Basilisk 2.12.2
        run: python -m pip install "bsk[all,examples]==2.12.2"
      - name: Simulate physical Basilisk battery, solar panel and eclipse
        run: python -m experiments.ground_01.run_ground --duration-hours 0.3 --step-s 10 --power --output-name power01_physical_acceptance
      - name: Validate power state and energy bounds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("results/power01_physical_acceptance")
          s = json.loads((p/"power_summary.json").read_text())
          assert s["checks_passed"]
          assert s["max_panel_power_w"] >= 0
          assert 0 <= s["minimum_battery_wh"] <= s["battery_capacity_wh"]
          assert (p/"power_states.csv").is_file()
          assert (p/"power_states.png").is_file()
          print("BASILISK POWER ACCEPTED:",s["final_battery_wh"],"Wh; max solar",s["max_panel_power_w"],"W")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power01-physical-battery
          path: results/power01_physical_acceptance/
          if-no-files-found: warn
