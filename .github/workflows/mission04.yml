name: Mission04 universal physical point and strip acceptance

on:
  pull_request:
    paths:
      - 'experiments/mission_03/**'
      - 'inputs/physical/**'
      - 'nirs_satellite/**'
      - 'tests/test_mission04_swath.py'
      - '.github/workflows/mission04.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/mission_03/**'
      - 'inputs/physical/**'
      - 'nirs_satellite/**'
      - 'tests/test_mission04_swath.py'
      - '.github/workflows/mission04.yml'

jobs:
  pure-program-and-footprint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q experiments nirs_satellite tests
      - run: python -m unittest tests.test_mission04_swath tests.test_launcher_core tests.test_input_registry -v

  mixed-physical-linux:
    needs: pure-program-and-footprint-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "bsk[all,examples]==2.12.2"
      - name: Actual Basilisk reaction-wheel nadir swath and point captures
        run: python -m experiments.mission_03.run --config inputs/physical/mission_mixed_demo.json --regions inputs/physical/territories.json --viz-mode off --duration-hours 0.2 --require-all-complete --output-name mission04_linux
      - name: Verify physical mixed mode and telemetry footprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/mission04_linux")
          r=json.loads((p/"mission03_summary.json").read_text())
          assert r["checks_passed"],r["checks"]
          assert r["task_count"]==3
          assert [t["capture_count"] for t in r["tasks"]]==[1,1,12],r["tasks"]
          assert r["strip_samples"]==12,r
          assert r["physical_target_switch_count"]==2
          assert abs(r["conservation_error_bits"])<160000
          assert (p/"mission03_strip_footprints.csv").is_file()
          assert (p/"execution_program_used.json").is_file()
          print("Mission04 mixed real Basilisk orbit/ADCS/power/camera/memory/downlink PASSED")
          PY
      - name: Check one-point program can execute independently
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("inputs/physical/mission_mixed_demo.json")
          cfg=json.loads(p.read_text())
          cfg["tasks"]=cfg["tasks"][:1]
          Path("one_point_ci.json").write_text(json.dumps(cfg))
          PY
          python -m experiments.mission_03.run --config one_point_ci.json --viz-mode off --duration-hours 0.2 --require-all-complete --output-name mission04_onepoint
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/mission04_onepoint/mission03_summary.json").read_text())
          assert r["task_count"]==1 and r["tasks"][0]["capture_count"]==1 and r["checks_passed"]
          print("ONE PHYSICAL TASK PASSED")
          PY
      - name: Check external planner-facing JSON contract with four physical tasks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("inputs/physical/mission_mixed_demo.json").read_text())
          extra=dict(cfg["tasks"][1])
          extra["id"]="TARGET_03_IMAGE"
          extra["lat_deg"]=15.2
          extra["lon_deg"]=43.7
          cfg["tasks"].insert(2,extra)
          Path("external_order_ci.json").write_text(json.dumps({
              "scenario_id":"external_order_demo",
              "schema_version":1,
              "provenance":"SYNTHETIC fixed-order external program, no optimizer",
              "execution_policy":"provided_order_only",
              "tasks":cfg["tasks"]},indent=2))
          PY
          python -m experiments.mission_03.run --config inputs/physical/mission_execution.json --program external_order_ci.json --regions inputs/physical/territories.json --viz-mode off --duration-hours 0.2 --require-all-complete --output-name mission04_four_tasks
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/mission04_four_tasks/mission03_summary.json").read_text())
          assert r["checks_passed"],r["checks"]
          assert [x["capture_count"] for x in r["tasks"]]==[1,1,1,12],r["tasks"]
          assert r["physical_target_switch_count"]==3
          print("EXTERNAL 4-TASK JSON EXECUTED PHYSICALLY, NO OPTIMIZER")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission04-linux
          path: results/mission04_*/
          if-no-files-found: warn

  mixed-physical-windows-vizard:
    needs: pure-program-and-footprint-tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "bsk[all,examples]==2.12.2"
      - name: Actual mixed point and strip dynamics plus Vizard binary
        run: python -m experiments.mission_03.run --config inputs/physical/mission_mixed_demo.json --regions inputs/physical/territories.json --viz-mode file --viz-step-s 10 --duration-hours 0.2 --require-all-complete --output-name mission04_windows
      - name: Check resulting image lines, physically switched target and playback file
        run: |
          python -c "import json,pathlib; p=pathlib.Path('results/mission04_windows'); r=json.loads((p/'mission03_summary.json').read_text()); assert r['checks_passed'] and r['vizard_created'] and r['strip_samples']==12, r; print('WINDOWS MIXED PHYSICAL+VIZARD PASSED')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission04-windows
          path: results/mission04_windows/
          if-no-files-found: warn
